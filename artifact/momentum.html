at\u0103 ce s-a f\u0103cut; vezi doar ce mai r\u0103m\xE2ne de f\u0103cut.",author:"Marie Curie",source:"scrisoare c\u0103tre fratele ei, 1894",tags:["levelup","evolve"],paths:["studiu"]},{id:"feynman-fool",text:"Primul principiu e s\u0103 nu te p\u0103c\u0103le\u0219ti pe tine \xEEnsu\u021Bi, iar tu e\u0219ti cel mai u\u0219or de p\u0103c\u0103lit.",author:"Richard Feynman",source:"discurs la Caltech, 1974",tags:["evolve","drop"],paths:["studiu"]},{id:"munger-wiser",text:"\xCEncearc\u0103 s\u0103 fii \xEEn fiecare zi pu\u021Bin mai \xEEn\u021Belept dec\xE2t erai c\xE2nd te-ai trezit.",author:"Charlie Munger",source:"discurs la USC, 2007",tags:["streak","levelup"],paths:["bani","studiu"]},{id:"jordan-missed",text:"Am ratat peste 9.000 de arunc\u0103ri \xEEn carier\u0103. Am pierdut aproape 300 de meciuri\u2026 Am e\u0219uat iar \u0219i iar \xEEn via\u021B\u0103. \u0218i de aceea reu\u0219esc.",author:"Michael Jordan",source:"reclam\u0103 Nike, 1997",tags:["reset","return","drop"],paths:["sport"]},{id:"jfk-fitness",text:"Condi\u021Bia fizic\u0103 nu este doar una dintre cheile unui corp s\u0103n\u0103tos; ea st\u0103 la baza activit\u0103\u021Bii intelectuale dinamice \u0219i creatoare.",author:"John F. Kennedy",source:"\u201EThe Soft American\u201D, Sports Illustrated, 1960",tags:["levelup","streak","evolve"],paths:["sport"]},{id:"brancusi-state",text:"Lucrurile nu sunt greu de f\u0103cut; greu este s\u0103 ne punem \xEEn starea de a le face.",author:"Constantin Br\xE2ncu\u0219i",source:"aforisme",tags:["return","drop","hatch","reset"],paths:["creativ"]},{id:"nietzsche-why",text:"Dac\u0103 ai propriul t\u0103u \u201Ede ce\u201D al vie\u021Bii, te \xEEmpaci cu aproape orice \u201Ecum\u201D.",author:"Friedrich Nietzsche",source:"Amurgul idolilor, Maxime, 12",tags:["drop","reset"]},{id:"euclid-royal",text:"Nu exist\u0103 drum regal c\u0103tre geometrie.",author:"Euclid",source:"dup\u0103 Proclus, Comentariu la Elemente",tags:["drop","levelup","streak"],paths:["studiu"]

 ce ai de f\u0103cut.",author:"Epictet",source:"Diatribe, III.23",tags:["hatch","return","levelup"]},{id:"epictetus-opinions",text:"Pe oameni nu \xEEi tulbur\u0103 lucrurile, ci p\u0103rerile lor despre lucruri.",author:"Epictet",source:"Manualul, 5",tags:["reset","drop"],paths:["minte"]},{id:"aristotle-acts",text:"Devenim drep\u021Bi s\u0103v\xE2r\u0219ind fapte drepte, cump\u0103ta\u021Bi prin fapte cump\u0103tate, curajo\u0219i prin fapte curajoase.",author:"Aristotel",source:"Etica nicomahic\u0103, II.1",tags:["streak","levelup"]},{id:"durant-habit",text:"Suntem ceea ce facem \xEEn mod repetat. Excelen\u021Ba nu este, a\u0219adar, un act, ci un obicei.",author:"Will Durant",source:"rezum\xE2ndu-l pe Aristotel \xEEn Povestea filozofiei, 1926",tags:["streak","levelup","evolve"]},{id:"laozi-step",text:"C\u0103l\u0103toria de o mie de li \xEEncepe sub t\u0103lpile tale.",author:"Lao Zi",source:"Tao Te Ching, 64",tags:["hatch","return","reset"]},{id:"plato-beginning",text:"\xCEnceputul este partea cea mai important\u0103 a oric\u0103rei lucr\u0103ri.",author:"Platon",source:"Republica, II, 377a",tags:["hatch","return","reset"]},{id:"socrates-examined",text:"O via\u021B\u0103 necercetat\u0103 nu merit\u0103 tr\u0103it\u0103.",author:"Socrate",source:"\xEEn Apologia lui Platon, 38a",tags:["evolve","levelup"]},{id:"newton-giants",text:"Dac\u0103 am v\u0103zut mai departe, este pentru c\u0103 am stat pe umerii unor gigan\u021Bi.",author:"Isaac Newton",source:"scrisoare c\u0103tre Robert Hooke, 1675",tags:["levelup","evolve"],paths:["studiu"]},{id:"einstein-bike",text:"Via\u021Ba e ca mersul pe biciclet\u0103: ca s\u0103-\u021Bi p\u0103strezi echilibrul, trebuie s\u0103 mergi mai departe.",author:"Albert Einstein",source:"scrisoare c\u0103tre fiul s\u0103u Eduard, 1930",tags:["drop","reset","streak","return"]},{id:"davinci-iron",text:"Fierul rugine\u0219te c\xE2nd nu e folosit, apa st\u0103tut\u0103 \xEE\u0219i pierde limpezimea; la fel, inactivitatea sec\u0103tuie\u0219t

",text:a("\xCEncearc\u0103 s\u0103 fii \xEEn fiecare zi pu\u021Bin mai \xEEn\u021Belept dec\xE2t erai c\xE2nd te-ai trezit."),author:a("Charlie Munger"),source:a("discurs la USC, 2007"),tags:["streak","levelup"],paths:["bani","studiu"]},{id:"jordan-missed",text:a("Am ratat peste 9.000 de arunc\u0103ri \xEEn carier\u0103. Am pierdut aproape 300 de meciuri\u2026 Am e\u0219uat iar \u0219i iar \xEEn via\u021B\u0103. \u0218i de aceea reu\u0219esc."),author:a("Michael Jordan"),source:a("reclam\u0103 Nike, 1997"),tags:["reset","return","drop"],paths:["sport"]},{id:"jfk-fitness",text:a("Condi\u021Bia fizic\u0103 nu este doar una dintre cheile unui corp s\u0103n\u0103tos; ea st\u0103 la baza activit\u0103\u021Bii intelectuale dinamice \u0219i creatoare."),author:a("John F. Kennedy"),source:a("\u201EThe Soft American\u201D, Sports Illustrated, 1960"),tags:["levelup","streak","evolve"],paths:["sport"]},{id:"brancusi-state",text:a("Lucrurile nu sunt greu de f\u0103cut; greu este s\u0103 ne punem \xEEn starea de a le face."),author:a("Constantin Br\xE2ncu\u0219i"),source:"aforisme",tags:["return","drop","hatch","reset"],paths:["creativ"]},{id:"nietzsche-why",text:a("Dac\u0103 ai propriul t\u0103u \u201Ede ce\u201D al vie\u021Bii, te \xEEmpaci cu aproape orice \u201Ecum\u201D."),author:a("Friedrich Nietzsche"),source:a("Amurgul idolilor, Maxime, 12"),tags:["drop","reset"]},{id:"euclid-royal",text:a("Nu exist\u0103 drum regal c\u0103tre geometrie."),author:a("Euclid"),source:a("dup\u0103 Proclus, Comentariu la Elemente"),tags:["drop","levelup","streak"],paths:["studiu"]},{id:"hesiod-little",text:a("Dac\u0103 adaugi pu\u021Bin la pu\u021Bin \u0219i faci asta des, \xEEn cur\xE2nd \u0219i acel pu\u021Bin va deveni mult."),author:a("Hesiod"),source:a("Munci \u0219i zile"),tags:["streak","levelup","evolve"],paths:["bani"]},{id:"ovid-drop",text:a("Pic\u0103tura scobe\u0219te piatra."),author:a("Ovidiu"),source:a("Scrisori din Pont, IV.10"),tags:["streak","levelup"]},{id:"confucius-mound

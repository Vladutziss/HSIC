<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0c0a1d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Molted" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Molted</title>
    <script>
      // Applies the saved colour theme before the first paint, so there is no flash of the dark one.
      // Keep the key in step with src/lib/themes.js.
      try {
        var t = (localStorage.getItem("molted.theme") || "").split(":");
        if (/^[a-z]+$/.test(t[0] || "") && (t[1] === "light" || t[1] === "dark")) {
          document.documentElement.dataset.theme = t[0];
          document.documentElement.dataset.mode = t[1];
          document.querySelector('meta[name="color-scheme"]').setAttribute("content", t[1]);
        }
      } catch (e) {}
    </script>
    <link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/nunito.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

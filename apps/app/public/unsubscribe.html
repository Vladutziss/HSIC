<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Molted · Emailuri</title><link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/fonts/nunito.css">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#cfc8f0;font:16px/1.65 Nunito,ui-rounded,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
background-color:#0c0a1d;background-image:radial-gradient(1100px 600px at 85% -15%,rgba(143,107,255,.18),transparent 60%),radial-gradient(900px 520px at -10% 115%,rgba(255,197,66,.08),transparent 60%)}
main{max-width:560px;margin:0 auto;padding:40px 16px 48px;display:grid;gap:16px}
.brand{font-weight:800;font-size:22px;color:#ffc542;text-decoration:none}
.panel{background:#1a1636;border:1px solid #2e2860;border-radius:18px;padding:24px}
h1{margin:0 0 10px;font-weight:800;font-size:26px;line-height:1.2;color:#f3efff}
p{margin:0 0 14px} p:last-child{margin-bottom:0}
button{font:inherit;font-weight:800;font-size:16px;cursor:pointer;border:0;border-radius:12px;padding:14px 22px;background:#ffc542;color:#2a1b00;min-height:48px}
button:hover{background:#ffd978} button:disabled{opacity:.6;cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid #ffd978;outline-offset:3px}
a{color:#b19bff} .dim{color:#9a91c9;font-size:14px}
.ok{color:#3fe0a5;font-weight:800} .err{color:#ff5f87;font-weight:800}
[hidden]{display:none!important}
</style></head>
<body><main>
<a class="brand" href="/">Molted</a>
<section class="panel" aria-live="polite">
<div id="ask">
<h1 id="t-title"></h1>
<p id="t-text"></p>
<p><button id="go" type="button"></button></p>
<p class="dim" id="t-hint"></p>
</div>
<div id="done" hidden>
<h1 id="t-done"></h1>
<p id="t-done-text"></p>
<p class="dim"><a id="t-back" href="/"></a></p>
</div>
<p id="problem" class="err" hidden></p>
</section>
</main>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var token = qs.get("t") || "";
  var lang = qs.get("lang") === "en" || (!qs.get("lang") && !/^ro/i.test(navigator.language || "")) ? "en" : "ro";
  var T = {
    ro: {
      title: "Te dezabonezi de la emailurile Molted?",
      text: "Nu vei mai primi emailuri de la Molted. Aplicația și contul tău rămân la fel, iar notificările din aplicație nu se schimbă.",
      go: "Da, dezabonează-mă",
      hint: "Poți porni emailurile oricând din aplicație, la Setări → Emailuri.",
      done: "Gata, te-ai dezabonat",
      doneText: "Nu îți mai trimitem emailuri de la Molted. Ne pare rău să te vedem plecând de pe listă și mulțumim că ai încercat.",
      back: "Înapoi la Molted",
      bad: "Linkul nu mai e valid. Deschide aplicația și oprește emailurile din Setări → Emailuri sau scrie-ne la molted.app@gmail.com.",
      fail: "Nu s-a putut acum. Încearcă din nou sau scrie-ne la molted.app@gmail.com."
    },
    en: {
      title: "Unsubscribe from Molted emails?",
      text: "You will stop receiving emails from Molted. The app and your account stay the same, and in-app notifications do not change.",
      go: "Yes, unsubscribe me",
      hint: "You can turn emails back on at any time in the app, under Settings → Emails.",
      done: "Done, you are unsubscribed",
      doneText: "We will not send you emails from Molted any more. Thank you for giving it a try.",
      back: "Back to Molted",
      bad: "This link is no longer valid. Open the app and turn emails off under Settings → Emails, or write to us at molted.app@gmail.com.",
      fail: "That did not work just now. Try again or write to us at molted.app@gmail.com."
    }
  }[lang];
  document.documentElement.lang = lang;
  document.title = "Molted · " + (lang === "en" ? "Emails" : "Emailuri");
  var $ = function (id) { return document.getElementById(id); };
  $("t-title").textContent = T.title; $("t-text").textContent = T.text; $("go").textContent = T.go; $("t-hint").textContent = T.hint;
  $("t-done").textContent = T.done; $("t-done-text").textContent = T.doneText; $("t-back").textContent = T.back;
  if (!/^[a-f0-9]{64}$/.test(token)) { $("ask").hidden = true; $("problem").hidden = false; $("problem").textContent = T.bad; return; }
  $("go").addEventListener("click", function () {
    var b = $("go"); b.disabled = true; $("problem").hidden = true;
    fetch("https://ldggxdgrmlhcfoherdlu.supabase.co/functions/v1/email?a=unsub", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t: token })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }).then(function (r) {
      if (!r.ok) throw new Error("bad");
      if (r.j && r.j.found === false) { $("ask").hidden = true; $("problem").hidden = false; $("problem").textContent = T.bad; return; }
      $("ask").hidden = true; $("done").hidden = false;
    }).catch(function () { b.disabled = false; $("problem").hidden = false; $("problem").textContent = T.fail; });
  });
})();
</script>
</body></html>

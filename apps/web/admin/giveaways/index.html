<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Admin giveaway-uri · Molted</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0c0a1d" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/nunito.css" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/admin-giveaways.js"></script>
  </head>
  <body class="app-bg min-h-screen font-sans text-body">
    <header class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-5 py-5">
      <a href="/admin/" class="font-pixel text-xl font-bold tracking-wide text-gold" aria-label="Admin Molted">MOLTED · ADMIN</a>
      <div class="flex items-center gap-4 text-sm font-bold">
        <a href="/admin/" class="text-dim hover:text-ink">Echipa</a>
        <button id="iesire" type="button" class="btn btn-ghost btn-xs" hidden>Ieși din cont</button>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-5 pb-24">
      <h1 class="font-pixel mt-4 text-3xl font-bold text-ink">Giveaway-uri</h1>
      <p id="stare" class="mt-2 text-dim" role="status" aria-live="polite">Se încarcă…</p>
      <p id="flash" class="mt-3 hidden rounded-xl px-4 py-3 text-sm font-bold" role="alert"></p>

      <div id="login" class="mt-8 flex justify-center" hidden></div>
      <div id="refuzat" class="panel mt-8" hidden>
        <p class="font-bold text-ink">Contul tău nu e admin.</p>
        <p class="mt-2 text-sm">Ești logat ca <b id="refuzat-email" class="text-ink"></b>. Cere unui admin să te adauge.</p>
      </div>

      <div id="admin" hidden>
        <section class="mt-8" aria-labelledby="t-sumar">
          <h2 id="t-sumar" class="font-pixel text-2xl font-bold text-ink">Sumar</h2>
          <div id="sumar" class="mt-4"></div>
        </section>

        <section class="mt-12" aria-labelledby="t-campanii">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <h2 id="t-campanii" class="font-pixel text-2xl font-bold text-ink">Campanii</h2>
            <button type="button" class="btn btn-sm" data-action="new-campaign">+ Campanie nouă</button>
          </div>
          <ul id="campanii" class="mt-4 grid gap-3"></ul>
        </section>

        <section id="campanie" class="mt-12" aria-labelledby="t-campanie" hidden></section>

        <section class="mt-14" aria-labelledby="t-parteneri">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <h2 id="t-parteneri" class="font-pixel text-2xl font-bold text-ink">Parteneri</h2>
            <button type="button" class="btn btn-sm" data-action="new-partner">+ Partener</button>
          </div>
          <p class="mt-2 text-sm text-dim">Adaugă doar texte și sigle aprobate de partener. Nu inventa descrieri, acorduri sau date de contact.</p>
          <ul id="parteneri" class="mt-4 grid gap-3"></ul>
        </section>
      </div>
    </main>
  </body>
</html>
